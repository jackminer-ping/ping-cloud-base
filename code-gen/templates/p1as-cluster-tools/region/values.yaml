# p1as-cluster-tools values

global:
  ###########################################################
  # Option 2: Use karpenter-crd helm chart
  # Instead of using the bundled crds in karpenter helm chart 
  # we can use karpenter-crd helm chart which may make karpenter upgrades easier
  ###########################################################
  karpenterCrdEnabled: true
  karpenterEnabled: true

# ingress-nginx-public values
ingress-nginx-public:
  ingress-nginx:
    serviceAccount:
      annotations:
        ${IRSA_INGRESS_ANNOTATION_KEY_VALUE}
    controller:
      autoscaling:
        minReplicas: 3
        maxReplicas: 3
        targetCPUUtilizationPercentage: 70
      service:
        annotations:
          ${NLB_NGX_PUBLIC_ANNOTATION_KEY_VALUE}
          
ingress-nginx-private:
# ingress-nginx-private values
  ingress-nginx:
    controller:
      autoscaling:
        minReplicas: 1
        maxReplicas: 1
        targetCPUUtilizationPercentage: 70


# Karpenter configuration
karpenter:
  # Controller settings
  karpenter-controller:
    settings:
      clusterName: ${CLUSTER_NAME}
    serviceAccount:
      # name: "karpenter-shauntest"
      annotations:
        # eks.amazonaws.com/role-arn: "arn:aws:iam::705370621539:role/shaunmills-primary-KarpenterControllerRole"
        ${KARPENTER_ROLE_ANNOTATION_KEY_VALUE}
  # Ec2NodeClass definitions
  ec2NodeClass:
    instanceProfile: "${KARPENTER_INSTANCE_PROFILE}"
