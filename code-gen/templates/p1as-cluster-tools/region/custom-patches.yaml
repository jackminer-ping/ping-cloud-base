### PS/GSO customizations to OOTB resources should only go into this file. Otherwise, CSR auto-updates will break. ###

### Always leave in at least this customization. Otherwise, kustomize will complain about an empty patch file. ###
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-tools-custom-placeholder
  namespace: ${PING_CLOUD_NAMESPACE}

---
#######################################################################################################
# Option 1:
# We keep using the bundled karpenter CRDs from the helm chart, but add these patches to get around k8s annotation limits
# Since the bundled crds are static files that we cannot change this patch was necessary to add these annotations via kustomize
#
# We are using Karpenter 1.0.11 helm chart which has the following crds:
# https://github.com/aws/karpenter-provider-aws/tree/release-v1.0.11/charts/karpenter/crds 
# which references the following crds:
# https://github.com/aws/karpenter-provider-aws/tree/release-v1.0.11/pkg/apis/crds
#
# Karpenter CRD patches to get around k8s annotation limits and allow ArgoCD to update the karpenter CRDs without manual intervention
#
########################################################################################################

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeclaims.karpenter.sh
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Replace=true
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ec2nodeclasses.karpenter.k8s.aws
  annotations:
\    argocd.argoproj.io/sync-options: ServerSideApply=true,Replace=true
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.karpenter.sh
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Replace=true
    argocd.argoproj.io/sync-wave: "-10"